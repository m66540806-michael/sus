<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Api Class</h2>
    <div id="fetchAPI"></div>



    <script>
        const ApiUser = document.getElementById('fetchAPI');

        fetch('https://jsonplaceholder.typicode.com/comments')
            .then(response => response.json())
            .then(data => {
                data.forEach(user => {
                    const listOfusers = `
                        <div>
                            <h2>${user.id}</h2>
                            <h3>${user.name}</h3>
                            <p>${user.body}</p>
                        </div>
                    `;
                    ApiUser.innerHTML += listOfusers;
                });
            })
            .catch(error => {
                console.error('Error fetching users:', error);
            });
    </script>
</body>

</html>
