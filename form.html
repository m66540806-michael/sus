<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <form action="" id="register">

            <h3>Registration Form</h3>
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter Username">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter User-Email">
            <label for="number">phone Number</label>
            <input type="number" id="number" placeholder="Enter phone-number">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
            <label for="confirmPass">Confirm Password</label>
            <input type="password" id="confirmPass" placeholder="Confirm password">
            <input type="submit" id="submit">
            <p id="message"></p>
        </form>
    </div>


    <script>
        const formRegistration = document.querySelector('#register');
        const message = document.querySelector('#message');
        formRegistration.addEventListener('submit', function (event) {
            event.preventDefault();

            const userName = document.querySelector('#username').value.trim();
            const Email = document.querySelector('#email').value.trim();
            const phone = document.querySelector('#number').value.trim();
            const password = document.querySelector('#password').value.trim();
            const confirmPass = document.querySelector('#confirmPass').value.trim();
            if (userName === '') {
                message.textContent = 'Username is required';
                return;
            }
            if (!Email.includes('@')) {
                message.textContent = 'enter a valid email address';
                return;
            }
            if (phone === '') {
                message.textContent = ' phone number is empty';
                return;
            }
            if (password.length < 6) {
                message.textContent = 'password must be more than six characters';
                return;
            }
            if (password !== confirmPass) {
                message.textContent = ' password does not match idiot';
                return;
            }

            const user = {
                userName: userName,
                Email: Email,
                phone: phone,
                password: password,
            };
            const storedUsers = JSON.parse(localStorage.getItem('users') || '[]');
            const users = Array.isArray(storedUsers) ? storedUsers : [storedUsers];
            users.push(user);
            localStorage.setItem('users', JSON.stringify(users));
            message.textContent = 'Registration successful';
            // form.reset();
            window.location.href = 'login.html';
        })

    </script>
</body>

</html>
